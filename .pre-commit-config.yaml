repos:
  # ruff runs through uv, so the hook uses exactly the version locked in uv.lock (the one CI uses)
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
  # Dependabot does not update this pin: `uv run pre-commit autoupdate --repo
  # https://github.com/gitleaks/gitleaks` from time to time, in its own pull request.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  # the owner's rule: no file above 10 MB in Git (raw run files are 15-40 MB)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=10240]
