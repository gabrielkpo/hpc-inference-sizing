name: CodeQL
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"  # weekly, Monday 05:00 UTC
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    # Code scanning is unavailable on free private repos; it runs once the repo is public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
