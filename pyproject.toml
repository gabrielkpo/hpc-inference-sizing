[project]
name = "hpc-inference-sizing"
version = "0.1.0"
description = "Size LLM inference on GPUs for a client: GPU count for a latency target, latency on a fixed GPU budget."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pre-commit>=4", "pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hpc_inference_sizing"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
