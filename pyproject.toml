[project]
name = "hpc-inference-sizing"
version = "0.3.0"
description = "Size LLM inference on GPUs for a client: GPU count for a latency target, latency on a fixed GPU budget."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mistral-common>=1.13.1",
    "pyarrow>=26.0.1",
]

[project.scripts]
hpc-sizing = "hpc_inference_sizing.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hpc_inference_sizing"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
# S311: random draws are for reproducible workloads and bootstrap, not for secrets
ignore = ["S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S603", "S607"]
# argv lists (never a shell) of fixed programs or of the operator's own matrix command
"src/hpc_inference_sizing/{bench/runner,campaign,follow}.py" = ["S603", "S607"]
# fixed https URLs of the Hugging Face checkpoints
"scripts/measure_checkpoint.py" = ["S310"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["hpc_inference_sizing"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = false
