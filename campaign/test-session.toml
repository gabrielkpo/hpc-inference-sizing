# Test session, protocol §10: does the model start on 2 x A40, does one unit answer, does the
# chain (sweep, run file, copy back) work on the real node? One unit, one profile, a short ladder.
# No number from it enters the results: it checks the path, then the instance is destroyed.
# Run on the node: uv run hpc-sizing campaign run --matrix campaign/test-session.toml

name = "test-session"
results_dir = "runs/scratch/test-session"
model = "mistralai/Mistral-Small-4-119B-2603-NVFP4"
profiles = ["rag"]
targets_s = [1.0, 2.0, 3.0]
step_duration_s = 60  # protocol steps are 180 s; here only the path is checked
min_requests = 10
start_rate = 0.25
max_rate = 2  # ladder 0.25, 0.5, 1, 2 req/s: about 5 minutes with the warm-up
bisect_steps = 0

[server]
url = "http://127.0.0.1:8000"
served_model = "small4"
health_timeout_s = 2400  # weights load (and download, if not fetched by node-setup.sh)
# Same command as campaign/a40-x2.toml, so the test session runs what the campaign will run.
command = """vllm serve {model} --host 127.0.0.1 --port 8000 --served-model-name small4 \
  --tokenizer-mode mistral --config-format mistral --load-format mistral \
  --attention-backend TRITON_MLA --max-model-len 8192 {flags}"""

[units.tp]
flags = "--tensor-parallel-size 2"
